<meta charset="utf-8">
<title>Шахматная страна — UpGrade Chess Club</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one column, big rounded game cards on white; club red and yellow carry the page, the board is the hero. */
:root {
  --bg: #ffffff;
  --card: #f6f4f2;
  --ink: #1b1a19;
  --muted: #6a6561;
  --red: #d7261e;
  --red-ink: #ffffff;
  --yellow: #ffc21a;
  --line: #e4dfda;
  --sq-light: #fbf6e6;
  --sq-dark: #8f9db3;
  --good: #1f8a4c;
  --bad: #c0261c;
  --font-display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161515; --card: #232120; --ink: #f4f1ee; --muted: #aaa39d; --red: #ff5a4f; --red-ink: #1b0a09;
    --line: #3a3634; --good: #5fd38d; --bad: #ff7a70; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161515; --card: #232120; --ink: #f4f1ee; --muted: #aaa39d; --red: #ff5a4f; --red-ink: #1b0a09;
  --line: #3a3634; --good: #5fd38d; --bad: #ff7a70; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-block: 12px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(30px, 7vw, 46px); }
h2 { font-size: 26px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-size: 20px; text-decoration: none; color: var(--ink); display: flex; gap: 6px; }
.brand b { color: var(--red); font-weight: 600; }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.nav a {
  text-decoration: none; color: var(--ink); background: var(--card); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 15px;
}
.nav a[aria-current="page"] { background: var(--red); color: var(--red-ink); }
.site-link { font-size: 14px; color: var(--muted); }
.site-link a { color: var(--muted); }

.say { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 20px; padding: 12px 16px 12px 12px; }
.av {
  flex: none; width: 56px; height: 56px; border-radius: 50%; object-fit: cover; display: block;
}
.say p { margin: 0; font-weight: 700; }
.say small { display: block; color: var(--muted); font-weight: 500; font-size: 13px; }

.hero { display: flex; flex-direction: column; gap: 10px; padding: 8px 0 0; }
.hero p { margin: 0; font-size: 19px; max-width: 34em; }
.hero .tag { color: var(--red); font-family: var(--font-display); font-size: 18px; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.card {
  display: flex; flex-direction: column; gap: 8px; text-align: left; text-decoration: none; color: var(--ink);
  background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 18px;
}
a.card:hover { border-color: var(--red); }
.card.soon { opacity: .6; }
.card p { margin: 0; color: var(--muted); font-size: 15px; }
.card .big { font-family: var(--font-display); font-size: 22px; }
.pill { align-self: flex-start; font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--yellow); color: #1b1a19; }

.stars { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.star { width: 26px; height: 26px; }
.star path { fill: none; stroke: var(--line); stroke-width: 2; stroke-linejoin: round; }
.star.on path { fill: var(--yellow); stroke: #c98f00; }

.heroes { display: flex; flex-wrap: wrap; gap: 10px 14px; }
.heroes figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 88px; text-align: center; font-size: 13px; line-height: 1.2; }
.heroes .av { width: 64px; height: 64px; }
.say .av { width: 64px; height: 64px; }
.note { font-size: 14px; color: var(--muted); margin: 0; }

:root { --bw: clamp(240px, calc(100vh - 330px), 540px); }
.boardbox { container-type: inline-size; width: min(100%, var(--bw)); margin: 0 auto; position: relative; }
.boardbox::after { content: ''; position: absolute; right: -6px; bottom: -6px; width: 30px; height: 30px; cursor: nwse-resize; touch-action: none; z-index: 20; background: linear-gradient(135deg, transparent 0 48%, #1b1a19 48% 56%, transparent 56% 66%, #1b1a19 66% 74%, transparent 74%); border-radius: 0 0 14px 0; opacity: .7; }
.bsize { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 6px 0; font-weight: 700; }
.bsize .btn { padding: 4px 12px; min-height: 0; font-size: 16px; } .bsize small { color: var(--muted); font-weight: 600; }
.board {
  display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr)); width: 100%; aspect-ratio: 1; border-radius: 14px; overflow: hidden;
  border: 4px solid var(--ink); background: var(--sq-dark);
}
.sq { position: relative; min-width: 0; min-height: 0; overflow: hidden; border: 0; padding: 0; display: grid; place-items: center; font-size: 9.6cqw; line-height: 1; background: var(--sq-dark); color: inherit; }
.sq.l { background: var(--sq-light); }
.sq.sel { box-shadow: inset 0 0 0 4px var(--yellow); }
.sq.hint { animation: pulse 1s ease-in-out infinite; }
.sq.last::after { content: ''; position: absolute; inset: 0; background: rgba(255, 194, 26, .38); }
.sq.tg { background-image: linear-gradient(rgba(255, 205, 40, .66), rgba(255, 205, 40, .66)); box-shadow: inset 0 0 0 3px rgba(255, 160, 0, .95); }
.sq.tg.cap { background-image: linear-gradient(rgba(255, 90, 60, .45), rgba(255, 90, 60, .45)); box-shadow: inset 0 0 0 4px rgba(230, 40, 20, .95); }
.board[data-tg="soft"] .sq.tg { background-image: radial-gradient(circle, rgba(40, 80, 50, .42) 0 16%, transparent 18%); box-shadow: none; }
.board[data-tg="soft"] .sq.tg.cap { background-image: radial-gradient(circle, transparent 0 60%, rgba(40, 80, 50, .42) 62% 80%, transparent 82%); box-shadow: none; }
.board[data-tg="soft"] .sq.sel { background-image: linear-gradient(rgba(40, 80, 50, .45), rgba(40, 80, 50, .45)); box-shadow: none; }
.sq.chk { background: radial-gradient(circle, #ff3b30 0 55%, transparent 75%), var(--sq-dark); }
.sq.l.chk { background: radial-gradient(circle, #ff3b30 0 55%, transparent 75%), var(--sq-light); }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 5px var(--yellow); } }
@media (prefers-reduced-motion: reduce) { .sq.hint { animation: none; box-shadow: inset 0 0 0 5px var(--yellow); } }

.msg { min-height: 56px; border-radius: 16px; padding: 12px 16px; background: var(--card); font-weight: 700; display: flex; align-items: center; }
.msg.good { background: var(--good); color: #fff; }
.msg.bad { background: var(--bad); color: #fff; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn {
  border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 800; background: var(--red); color: var(--red-ink); font-size: 17px;
}
.btn.alt { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
.btn[disabled] { opacity: .45; cursor: default; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 16px; font-weight: 800; }
.seg button[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: #1b1a19; }
.count { font-family: var(--font-display); color: var(--muted); font-size: 18px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); font-weight: 800; font-size: 14px; }
.dots button.cur { border-color: var(--red); }
.dots button.done { background: var(--yellow); border-color: #c98f00; color: #1b1a19; }

.world { display: flex; flex-direction: column; gap: 10px; }
.wh { display: flex; gap: 12px; align-items: center; }
.wh h3 { font-size: 20px; }
.wh p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.lvgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
.lvbtn { position: relative; display: grid; grid-template-columns: 48px 1fr; align-items: center; gap: 2px 8px; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 8px; min-width: 0; }
.lvbtn .av { grid-row: 1 / 3; width: 48px; height: 48px; }
.lvbtn .ln { font-family: var(--font-display); font-size: 20px; line-height: 1; align-self: end; }
.lvbtn .rn { font-size: 12px; line-height: 1.15; color: var(--muted); align-self: start; overflow-wrap: anywhere; }
.lvbtn:not([disabled]):hover { border-color: var(--red); }
.lvbtn[disabled] { opacity: .5; cursor: default; }
.lvbtn.won { border-color: #c98f00; }
.lvbtn .star { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; }
.lvbtn .lock { position: absolute; top: 6px; right: 8px; font-size: 11px; font-weight: 800; color: var(--muted); }
.promo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--card); border-radius: 16px; padding: 10px 14px; font-weight: 700; }
.promo button { width: 56px; height: 56px; border-radius: 14px; border: 2px solid var(--line); background: var(--sq-light); font-size: 34px; line-height: 1; padding: 0; display: grid; place-items: center; }

.pcs { width: 88%; height: 88%; position: relative; z-index: 2; pointer-events: none; }
.f { fill: var(--pf); stroke: var(--ps); stroke-width: 1.5; stroke-linejoin: round; }
.ln { fill: none; stroke: var(--lnc, #1b1a19); stroke-width: 1.2; stroke-linecap: round; }
.pcs.w { --pf: #ffffff; --ps: #1b1a19; --lnc: #1b1a19; --eye: #1b1a19; }
.pcs.b { }
.board[data-board="bw"] { --sq-light: #fbf6e6; --sq-dark: #8f9db3; }
.board[data-board="green"] { --sq-light: #eeeed2; --sq-dark: #6f9a54; }
.board[data-board="brown"] { --sq-light: #f0d9b5; --sq-dark: #b58863; }
.board[data-board="blue"] { --sq-light: #dee3e6; --sq-dark: #5f87b5; }
.board[data-board="grey"] { --sq-light: #e8e8e8; --sq-dark: #8a8a8a; }
.board[data-pset="warm"] .pcs.w { filter: sepia(.8) saturate(1.3); }
.board[data-pset="warm"] .pcs.b { filter: invert(.2) sepia(1) saturate(2); }
.board[data-pset="blue"] .pcs.w { filter: sepia(1) hue-rotate(170deg) saturate(1.3); }
.board[data-pset="blue"] .pcs.b { filter: invert(.2) sepia(1) saturate(3) hue-rotate(180deg); }
.board[data-pset="red"] .pcs.w { filter: sepia(1) hue-rotate(-30deg) saturate(2.5); }
.board[data-pset="red"] .pcs.b { filter: invert(.2) sepia(1) saturate(4) hue-rotate(-30deg); }
.board[data-pset="bold"] .pcs { filter: drop-shadow(0 0 .7px #000) drop-shadow(0 0 .7px #000); }
.board.noanim .pcs.mvpc { animation: none !important; }
.promo .pcs { width: 40px; height: 40px; }
.boardtheme { justify-content: center; }
.boardtheme button { padding: 6px 12px; font-size: 14px; }

.pal { display: flex; flex-wrap: wrap; gap: 6px; background: var(--card); border-radius: 16px; padding: 10px; }
.pal button { min-width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--sq-light); display: grid; place-items: center; padding: 0 8px; font-weight: 800; font-size: 14px; }
.pal button .pcs { width: 38px; height: 38px; }
.pal button.erase, .pal button.side { background: var(--bg); }
.pal button[aria-pressed="true"] { border-color: var(--red); box-shadow: 0 0 0 2px var(--red); }
.mvlist { margin: 6px 0 0; line-height: 1.9; word-spacing: 2px; }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
.sndbtn { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 14px; }
.sndbtn[aria-pressed="false"] { opacity: .6; }
.sq.bestm::after { content: ''; position: absolute; inset: 0; background: rgba(31, 138, 76, .5); }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.wcard { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; text-decoration: none; color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 14px 10px; }
.wcard:hover { border-color: var(--red); }
.wcard.locked { opacity: .5; }
.wcard.full { border-color: #c98f00; background: linear-gradient(180deg, var(--card), rgba(255, 194, 26, .25)); }
.wpc { width: 64px; height: 64px; border-radius: 50%; background: var(--sq-light); display: grid; place-items: center; border: 2px solid var(--line); }
.wpc .pcs { width: 46px; height: 46px; }
.wn { font-family: var(--font-display); font-size: 17px; line-height: 1.15; }
.wc { font-size: 13px; color: var(--muted); font-weight: 700; }
.bar { width: 100%; height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar.big { height: 14px; }
.bar i { display: block; height: 100%; background: var(--yellow); border-radius: 999px; transition: width .2s; }
.srow { position: absolute; top: 6px; right: 6px; display: flex; gap: 1px; }
.srow .star { position: static; width: 12px; height: 12px; }
.lvbtn .srow .star { width: 12px; height: 12px; }
.modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: grid; place-items: center; padding: 16px; z-index: 70; overflow: auto; }
.mbox { background: var(--bg); color: var(--ink); border-radius: 26px; padding: 24px; max-width: 460px; width: 100%; display: flex; flex-direction: column; gap: 14px; text-align: center; border: 4px solid var(--yellow); animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); }
.mbox p { margin: 0; }
.mbox .row { justify-content: center; }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }
.bigstars { display: flex; justify-content: center; gap: 8px; }
.bigstars .star { width: 64px; height: 64px; }
.bigstars span { animation: pop .5s both; }
.newm { background: var(--card); border-radius: 18px; padding: 12px; }
.mrow { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; }
.mitem { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100px; font-size: 14px; font-weight: 800; line-height: 1.2; }
.mitem small { color: var(--muted); font-weight: 600; }
.medal .mpc { --pf: #fff; --ps: #1b1a19; --lnc: #1b1a19; }
.medal { filter: drop-shadow(0 3px 3px rgba(60, 40, 0, .3)); }
.medal.off { opacity: .45; filter: grayscale(1); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stats div { background: var(--card); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; align-items: center; }
.stats b { font-family: var(--font-display); font-size: 30px; color: var(--red); }
.stats span { font-size: 14px; color: var(--muted); font-weight: 700; text-align: center; }
.mgroup { display: flex; flex-direction: column; gap: 10px; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.mcell { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; background: var(--card); border-radius: 16px; padding: 10px 6px; font-weight: 800; font-size: 14px; line-height: 1.2; }
.mcell small { color: var(--muted); font-weight: 600; font-size: 12px; }
.mcell.ok { border: 2px solid #c98f00; }
.rvhead { display: flex; flex-direction: column; gap: 12px; background: var(--card); border-radius: 20px; padding: 16px; }
.rside { display: flex; flex-direction: column; gap: 6px; }
.acc { font-weight: 800; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 4px; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 800; border: 2px solid transparent; }
.chip i { font-style: normal; font-weight: 800; }
.chip.cb { background: #d6f3e1; color: #0f5a2e; } .chip.cg { background: #e7f3d2; color: #3e5d0c; }
.chip.ci { background: #fff0b8; color: #6b5200; } .chip.cm { background: #ffd9b3; color: #7a3a00; } .chip.cz { background: #ffc9c4; color: #8a120b; }
.chip[role="button"] { cursor: pointer; } .chip.sel { border-color: var(--ink); }
.graph { width: 100%; height: 80px; border-radius: 12px; display: block; }
[hidden] { display: none !important; }

.ptsbadge { font-weight: 800; font-size: 15px; background: var(--yellow); color: #1b1a19; padding: 8px 12px; border-radius: 999px; text-decoration: none; }
.toast { position: fixed; left: 50%; top: 74px; transform: translateX(-50%); background: #1b1a19; color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 800; z-index: 60; box-shadow: 0 6px 20px rgba(0,0,0,.3); animation: tin .25s ease-out; }
.toast + .toast { top: 124px; }
.toast.out { opacity: 0; transition: opacity .5s; }
@keyframes tin { from { opacity: 0; transform: translate(-50%, -10px); } }
.sq .mk { position: absolute; z-index: 4; font-size: 8cqw; line-height: 1; color: #ffc21a; text-shadow: 0 0 2px #1b1a19, 0 0 2px #1b1a19, 0 1px 0 #1b1a19; pointer-events: none; }
.sq .mk.fl { color: #d7261e; }
.sq.wall { background: repeating-linear-gradient(45deg, #7a5a3a 0 6px, #5d4329 6px 12px) !important; }
.sq.hl::after { content: ''; position: absolute; inset: 0; background: rgba(215, 38, 30, .38); }
.sq .co { position: absolute; z-index: 5; font-style: normal; font-size: 3.4cqw; font-weight: 900; opacity: 1; pointer-events: none; color: var(--sq-dark); }
.sq.l .co { color: #4a4745; }
.sq:not(.l) .co { color: #ffffff; text-shadow: 0 0 2px #1b1a19; }
.sq .co.r { top: 2px; left: 3px; } .sq .co.f { bottom: 1px; right: 3px; }
.course h3 { margin: 16px 0 6px; }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.lcard { display: flex; flex-direction: column; gap: 6px; text-align: left; text-decoration: none; color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 14px 16px; }
.lcard:hover { border-color: var(--red); }
.lcard .big { font-family: var(--font-display); font-size: 20px; line-height: 1.15; }
.lcard p { margin: 0; color: var(--muted); font-size: 14px; }
.lcard.done { border-color: #1f8a4c; }
.bar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--red); }
.slide { background: var(--card); border-radius: 20px; padding: 16px 18px; }
.slide h3 { margin-top: 0; }
.slide p { margin: 8px 0; }
.lvrow { display: flex; flex-wrap: wrap; gap: 8px; }
.lvn { width: 46px; height: 46px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-weight: 800; font-size: 17px; color: var(--ink); }
.lvn.ok { background: #1f8a4c; color: #fff; border-color: #1f8a4c; }
.lvn.cur { border-color: var(--red); box-shadow: 0 0 0 3px var(--yellow); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.opts button { padding: 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); font-size: 20px; font-weight: 800; color: var(--ink); }
.opts button.good { background: #1f8a4c; color: #fff; } .opts button.bad { background: var(--red); color: #fff; }
</style>
<style>/* ===== Яркая тема для детей ===== */
:root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
  --bg: #cfeeff; --card: #ffffff; --ink: #1b1a19; --muted: #5b5652; --red: #d7261e; --red-ink: #ffffff;
  --line: #ffd36b; --good: #1f8a4c; --bad: #c0261c; color-scheme: light;
}
html { background: #cfeeff; }
body { background: linear-gradient(180deg, #a9ddff 0%, #d9f1ff 34%, #fff6d6 100%) fixed; padding-bottom: 104px; min-height: 100vh; }
.wrap { position: relative; z-index: 1; }
#sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
#sky span { position: absolute; color: rgba(255, 255, 255, .75); line-height: 1; animation: drift linear infinite; will-change: transform; }
@keyframes drift { from { transform: translateY(110vh) rotate(0deg); } to { transform: translateY(-20vh) rotate(360deg); } }
.top { background: #fff; border-radius: 28px; padding: 10px 16px; box-shadow: 0 6px 0 rgba(215, 38, 30, .25); border: 3px solid #fff; }

        { h: '4. Унцикер — Сарапу, Зиген, 1970', p: ['Партия сыграна на шахматной олимпиаде в Зигене. Белые поставили ловушку ходом 17.Сf4, чёрные взяли слона и получили спёртый мат по уже знакомой схеме.', 'Обратите внимание на последние три хода: шах ферзём на f7, жертва ферзя на g8, мат конём на f7.'], demo: G('e2e4 c7c5 g1f3 g8f6 e4e5 f6d5 b1c3 e7e6 c3d5 e6d5 d2d4 b8c6 d4c5 f8c5 d1d5 d8b6 f1c4 c5f2 e1e2 e8g8 h1f1 f2c5 f3g5 c6d4 e2d1 d4e6 g5e4 d7d6 e5d6 c5d6 e4d6 f8d8 c1f4 e6f4 d5f7 g8h8 f7g8 d8g8 d6f7', { 29: 'Ошибка: слон берёт пешку и теряет защиту короля.|??', 32: 'Сильный ход: слон предлагает себя, взять его опасно.|!', 33: 'Чёрные берут слона и попадают в ловушку.|?', 34: 'Шах ферзём: король уходит в угол.', 36: 'Жертва ферзя: ладья вынуждена взять и закрыть поле g8.|!', 38: 'Мат конём. Король на h8 закрыт ладьёй g8 и пешками.' }) },

        { h: '7. Будапештская ловушка', p: ['Будапештский гамбит: чёрные отдают пешку и быстро развиваются. Ловушка стоит на единственной ошибке белых.', 'После 8.axb4 ход 8…Кd3 ставит мат. Белые взяли фигуру и забыли про своего короля.'], demo: G('d2d4 g8f6 c2c4 e7e5 d4e5 f6g4 c1f4 b8c6 g1f3 f8b4 b1d2 d8e7 a2a3 g4e5 a3b4 e5d3', { 14: 'Грубая ошибка: белые берут слона и не замечают угрозу на d3.|??', 15: 'Мат конём: король закрыт своими ферзём, слоном, конём и пешками.' }) },
        { h: '8. Ловушка Блэкбёрна — Шиллинга', p: ['Название связывают с английским мастером Джозефом Блэкбёрном. Чёрные жертвуют несколько пешек, а потом ставят спёртый мат.', 'Белые ошибаются, взяв пешку e5 и затем f7. Ловушку нужно знать и за чёрных, и за белых.'], demo: G('e2e4 e7e5 g1f3 b8c6 f1c4 c6d4 f3e5 d8g5 e5f7 g5g2 h1f1 g2e4 c4e2 d4f3', { 5: 'Чёрные ставят ловушку: конь идёт на d4, где его можно взять.|?!', 6: 'Белые берут «бесплатную» пешку e5, не проверив шахи и жертвы. Спокойнее было взять коня на d4.|?!', 7: 'Сильный ход: ферзь нападает на g2 и e5 сразу.|!', 8: 'Грубая ошибка: пешка f7 стоила белым партии. Нужно было думать о защите ладьи h1.|??', 12: 'Белые закрыли шах слоном.', 13: 'Спёртый мат: король окружён своими фигурами.' }) },
        { h: '9. Алёхин, сеанс одновременной игры, 1935', p: ['Ловушка в защите Каро — Канн. После 5.Фe2 чёрные ответили 5…Кgf6, и конь с e4 пошёл на d6 с матом.', 'Шах конём на d6 оказывается матом: король e8 закрыт собственными ферзём, слоном, конём d7 и пешками. Ловушку нужно знать за чёрных, чтобы её избегать.'], demo: G('e2e4 c7c6 d2d4 d7d5 b1c3 d5e4 c3e4 b8d7 d1e2 g8f6 e4d6', { 8: 'Фe2 ставит ловушку.|!?', 9: 'Грубая ошибка: после этого хода конь e4 даёт мат на d6.|??', 10: 'Мат конём.' }) },

  /* ===== Второй год, урок 1: Повторение первого года ===== */
  (function () {
    var BK = [];
    try { BK = REVIEW2_BANK; } catch (e) { BK = []; }
    function ST(fen, steps) { return { fen: fen, steps: steps }; }
    var LR = {
      id: 'review2', t: 'Повторение первого года', d: 'Мат, рокировка, взятие на проходе, превращение, пат, вечный шах, двойной удар и размены. ' + BK.length + ' разных задач.', bank: BK, mate: false, ask: 'Найдите лучший ход.', slides: [
        { h: '1. Цель игры: шах и мат', p: ['Цель партии — поставить мат: король атакован и ни один ответ не спасает. На шах есть три ответа: отойти королём, закрыться своей фигурой, взять атакующую фигуру. Нет ни одного — мат.', 'Мат в один ход ищем так: перечислите все шахи, затем для каждого проверьте три ответа. Нажмите «Показать»: ладья ставит классический мат на последней горизонтали.'], demo: ST('6k1/5ppp/8/8/8/8/5PPP/3R2K1 w - - 0 1', ['d1d8|Шах по восьмой горизонтали. Свои пешки закрыли королю все поля.']) },
        { h: '2. Ценность фигур', p: ['Пешка — 1, конь и слон — по 3, ладья — 5, ферзь — 9. Король бесценен.', 'Обмен выгоден, если вы получаете больше, чем отдаёте. Перед каждым взятием посчитайте: что я теряю, что получаю, что можно будет взять в ответ.'], fen: 'r3k2r/ppp2ppp/2n1bn2/3qp3/3P4/2N1BN2/PPP2PPP/R2QK2R w KQkq - 0 1' },
        { h: '3. Рокировка и её запреты', p: ['Рокировка — единственный ход, которым двигаются две фигуры: король на два поля к ладье, ладья перепрыгивает через него. Она спасает короля и вводит ладью в игру.', 'Нельзя рокироваться, если: король или эта ладья уже ходили; король под шахом; король проходит через атакованное поле или встаёт под шах; между королём и ладьёй есть фигуры.'], demo: ST('r3k2r/pppq1ppp/2np1n2/2b1p3/2B1P3/2NP1N2/PPP2PPP/R1BQK2R w KQkq - 0 1', ['e1g1|Короткая рокировка: король на g1, ладья на f1.']) },
        { h: '4. Взятие на проходе', p: ['Если пешка идёт на два поля и становится рядом с пешкой соперника, соперник может взять её так, будто она сделала один шаг. Это право действует только один ход — сразу.'], demo: ST('4k3/8/8/8/3p4/8/4P3/4K3 w - - 0 1', ['e2e4|Пешка прошла два поля и встала рядом с чёрной.', 'd4e3|Чёрные берут «на проходе»: пешка e4 исчезает.']) },
        { h: '5. Превращение пешки', p: ['Дошедшая до последней горизонтали пешка превращается в любую фигуру, кроме короля. Почти всегда выбирают ферзя, но иногда нужен конь или ладья.'], demo: ST('8/P6k/8/8/8/8/8/K7 w - - 0 1', ['a7a8q|Новый ферзь. Теперь у белых огромный перевес.']) },
        { h: '6. Пат — ничья', p: ['Пат: у стороны, чья очередь хода, нет допустимых ходов, но король не под шахом. Партия — ничья.', 'Главная ловушка — выигрышная позиция, где слишком «сильный» ход оставляет королю соперника без полей. Перед ходом спросите себя: останется ли у соперника хоть один ход?'], demo: ST('k7/8/1K6/8/8/8/8/2Q5 w - - 0 1', ['c1c7|Ошибка: у чёрных нет ходов и нет шаха. Пат, ничья. Правильно было c1c8#.']) },
        { h: '7. Вечный шах', p: ['Если у вас хуже, а у короля соперника нет укрытия, можно давать шах за шахом. Соперник не может прервать их, и партия заканчивается ничьей — вечный шах.', 'В задачах такого типа ищите последовательность шахов, которая не даёт королю спрятаться.'], fen: '7k/6p1/8/5Q2/3r4/3q4/5PPP/6K1 w - - 0 1' },

        if (rv && rv.res && rv.res[k]) { var c = CLS[rv.res[k].cls]; tag = '<span class="chip ' + c.c + (rv.idx === k ? ' sel' : '') + '" data-k="' + k + '" role="button" tabindex="0"><i>' + c.s + '</i> ' + esc(t) + '</span>'; } else tag = t;
        if (white) h += '<b>' + num + '.</b> ' + tag + ' ';
        else h += (k === 0 ? '<b>' + num + '…</b> ' : '') + tag + ' ';
      });
      el.innerHTML = h;
    }
    function turnMsg() {
      var st = E.status(S.pos);
      if (st === 'check') setMsg('Шах! Ход ' + who() + '.', 'bad'); else setMsg('Ход ' + who() + '.');
    }
    function checkEnd() {
      var st = E.status(S.pos);
      if (st === 'mate') { over = true; setMsg('Мат! Победили ' + (S.pos.turn === 1 ? 'чёрные' : 'белые') + '.', 'good'); return true; }
      if (st === 'stalemate') { over = true; setMsg('Пат: ходить некуда, но шаха нет. Ничья.'); return true; }
      if (E.insufficient(S.pos)) { over = true; setMsg('Ничья: слишком мало фигур для мата.'); return true; }
      if (S.pos.half >= 100) { over = true; setMsg('Ничья по правилу 50 ходов.'); return true; }
      if (keys[E.key(S.pos)] >= 3) { over = true; setMsg('Ничья: позиция повторилась три раза.'); return true; }
      over = false; return false;
    }
    function snapshot() { return { pos: S.pos, last: S.last, keys: JSON.parse(JSON.stringify(keys)), over: over }; }
    function restore(s) { S.pos = s.pos; S.last = s.last; keys = s.keys; over = s.over; S.sel = null; S.targets = []; S.hint = null; S.best = null; }
    function doMove(m) {
      past.push({ snap: snapshot() }); future = [];
      var before = S.pos;
      recs.push({ pos: before, m: m });
      S.pos = E.make(S.pos, m); S.last = { f: m.f, t: m.t }; S.sel = null; S.targets = []; S.hint = null; S.best = null; S.anim = animOf(before, m);
      moveSound(before, m, S.pos);
      var k = E.key(S.pos); keys[k] = (keys[k] || 0) + 1;
      document.getElementById('promo').hidden = true; busy = false; clkMoved(before.turn);
      if (!checkEnd()) turnMsg();
      draw();
      autoComp();
    }
    function click(i) {
      if (busy || rv) return;
      if (mode === 'setup') { setupClick(i); return; }
      if (over) return;
      if (vs() && S.pos.turn !== myCol()) return;
      var v = S.pos.b[i];
      if (S.sel != null && S.targets.indexOf(i) >= 0) {
        var c = movesFrom(S.pos, S.sel).filter(function (x) { return x.t === i; });
        if (c.length > 1) { choosePromo(c); return; }
        doMove(c[0]); return;
      }
      if (v && (v > 0) === (S.pos.turn > 0)) { S.sel = i; S.targets = movesFrom(S.pos, i).map(function (m) { return m.t; }); S.hint = null; }
      else { S.sel = null; S.targets = []; }
      draw();
    }
    function choosePromo(c) {
      var el = document.getElementById('promo'), h = '<span>Во что превратить пешку?</span>';
      c.forEach(function (m, i) { h += '<button data-i="' + i + '" aria-label="' + PNAME[m.p] + '">' + pcHTML(S.pos.turn * m.p) + '</button>'; });
      el.innerHTML = h; el.hidden = false; busy = true;
      el.onclick = function (e) { var b = e.target.closest('button'); if (b) { busy = false; doMove(c[+b.dataset.i]); } };
    }
    function reset(pos, tn) {
      closeReview();
      S.pos = pos; S.sel = null; S.targets = []; S.last = null; S.hint = null; S.best = null; past = []; future = []; recs = []; evHist = []; startPos = pos; keys = {}; keys[E.key(pos)] = 1; over = false; clkReset();
      document.getElementById('promo').hidden = true;
    }
    document.getElementById('bNew').onclick = function () { if (mode === 'setup') leaveSetup(true); gen++; busy = false; reset(E.start(), 1); S.flip = vs() > 0 && myCol() === -1; turnMsg(); draw(); autoComp(); };
    document.getElementById('bUndo').onclick = function () {
      if (!past.length || busy || rv) return;
      var p = past.pop(); future.push({ snap: snapshot(), rec: recs.pop() });
      restore(p.snap); gen++; if (vs() && S.pos.turn !== myCol() && past.length) { var p2 = past.pop(); future.push({ snap: snapshot(), rec: recs.pop() }); restore(p2.snap); } if (!checkEnd()) turnMsg(); draw();
    };
    document.getElementById('bRedo').onclick = function () {
      if (!future.length || busy || rv) return;
      var f = future.pop(); past.push({ snap: snapshot() }); recs.push(f.rec);
      restore(f.snap); if (!checkEnd()) turnMsg(); draw();
    };
    document.getElementById('bFlip').onclick = function () { S.flip = !S.flip; draw(); };
    document.getElementById('bHint').onclick = function () {
      if (mode === 'setup' || over || busy || rv) return;
      setMsg('Думаю…'); busy = true;
      later(function () {
        var bk = bookPick(S.pos);
        if (bk) { busy = false; S.sel = null; S.hint = bk.m.f; S.targets = [bk.m.t]; setMsg('Дебютный ход: ' + notation(bk.m, S.pos) + ' (' + PNAME[Math.abs(S.pos.b[bk.m.f])] + '). Так играют в дебюте «' + bk.name + '».'); draw(); return; }
        var r = E.think(S.pos, { depth: 12, ms: 1500 }); busy = false;
        if (r) {
          var sc = r.score * S.pos.turn, txt = Math.abs(sc) > 90000 ? 'Есть мат!' : (sc > 40 ? 'У белых перевес: +' + (sc / 100).toFixed(1) : sc < -40 ? 'У чёрных перевес: +' + (-sc / 100).toFixed(1) : 'Позиция равная.');
          S.sel = null; S.hint = r.move.f; S.targets = [r.move.t]; setMsg('Лучший ход: ' + notation(r.move, S.pos) + ' (' + PNAME[Math.abs(S.pos.b[r.move.f])] + '). ' + txt);
        }
        draw();
      }, 60);
    };

    /* разбор */
    function closeReview() {
      token.cancel = true; token = { cancel: false }; rv = null;
      var bx = document.getElementById('rvbox'); bx.hidden = true; bx.innerHTML = '';
      document.getElementById('ctl').hidden = false; S.best = null;
    }
    function finalPos() { var r = recs[recs.length - 1]; return E.make(r.pos, r.m); }
    function startReview() {
      if (!recs.length || mode === 'setup') return;
      engOn = true; engFen = '';
      var bx = document.getElementById('rvbox'); bx.hidden = false;
      rv = { res: null, idx: -1 };
      var live = S.pos, liveLast = S.last;
      S.sel = null; S.targets = []; S.hint = null;
      bx.innerHTML = '<div class="rvhead"><h3>Разбор партии</h3><p id="prog" role="status">Профессор изучает партию…</p><div class="bar big" aria-hidden="true"><i id="pbar" style="width:0%"></i></div><button class="btn alt" id="rvStop">Отмена</button></div>';
      bx.querySelector('#rvStop').onclick = function () { S.pos = live; S.last = liveLast; closeReview(); turnMsg(); draw(); };
      document.getElementById('ctl').hidden = true;
      var tk = token;
      analyzeAll(recs, function (i, n) {
        var p = document.getElementById('prog'); if (p) p.textContent = 'Профессор изучает партию: ход ' + i + ' из ' + n;
        var b = document.getElementById('pbar'); if (b) b.style.width = (i * 100 / n) + '%';
      }, function (res) {
        if (tk.cancel) return;
        rv.res = res; rv.idx = res.length - 1; sfx('good');
        bx.innerHTML = '<div class="rvhead"><h3>Разбор партии</h3><div class="rvsum">' + reviewHTML(res) + '</div><div id="rvsay"></div>' +
          '<div class="row"><button class="btn alt" id="rvPrev">◀ Ход назад</button><button class="btn alt" id="rvNext">Ход вперёд ▶</button><button class="btn" id="rvClose">Закрыть разбор</button></div></div>';
        bx.querySelector('#rvPrev').onclick = function () { go(rv.idx - 1); };
        bx.querySelector('#rvNext').onclick = function () { go(rv.idx + 1); };
        bx.querySelector('#rvClose').onclick = function () { S.pos = live; S.last = liveLast; closeReview(); turnMsg(); draw(); };
        go(rv.idx);
      }, tk);
    }
    function go(k) {
      if (!rv || !rv.res) return;
      if (k < -1) k = -1; if (k > recs.length - 1) k = recs.length - 1;
      rv.idx = k;
      if (k < 0) { S.pos = startPos; S.last = null; S.best = null; S.badge = null; var sy0 = document.getElementById('rvsay'); if (sy0) sy0.innerHTML = ''; setMsg('Начало партии.'); draw(); return; }
      var r = recs[k], a = rv.res[k], c = CLS[a.cls], good = a.cls === 'best' || a.cls === 'good' || a.cls === 'brill' || a.cls === 'great';
      S.pos = k + 1 < recs.length ? recs[k + 1].pos : finalPos(); S.last = { f: r.m.f, t: r.m.t };
      S.best = good ? null : { f: a.best.f, t: a.best.t };
      S.badge = { sq: r.m.t, cls: a.cls, s: c.s };
      var side = r.pos.turn === 1 ? 'Белые' : 'Чёрные', bad = a.cls === 'blunder' || a.cls === 'mistake' || a.cls === 'inacc';
      setMsg(side + ': ' + a.text + c.s + ' — ' + c.n + '.', a.cls === 'blunder' || a.cls === 'mistake' ? 'bad' : (a.cls === 'inacc' ? '' : 'good'));
      var sy = document.getElementById('rvsay'); if (sy) sy.innerHTML = say(av('prof'), 'Профессор', profWords(a, r), c.s + ' ' + c.n);
      if (!rv.mute) sfx(a.cls === 'blunder' ? 'blunder' : a.cls === 'mistake' ? 'mistake' : a.cls === 'inacc' ? 'inacc' : a.cls === 'brill' ? 'brill' : a.cls === 'great' ? 'great' : 'move');
      draw();
    }
    document.getElementById('bAn').onclick = startReview;
    document.getElementById('mv').onclick = function (e) { var s = e.target.closest('[data-k]'); if (s && rv && rv.res) go(+s.dataset.k); };

    /* расстановка */
    function palette() {
      var el = document.getElementById('pal'), h = '';
      [1, 2, 3, 4, 5, 6].forEach(function (t) { h += '<button data-b="' + t + '" aria-label="белый ' + PNAME[t] + '">' + pcHTML(t) + '</button>'; });
      [1, 2, 3, 4, 5, 6].forEach(function (t) { h += '<button data-b="' + (-t) + '" aria-label="чёрный ' + PNAME[t] + '">' + pcHTML(-t) + '</button>'; });
      h += '<button data-b="0" class="erase">Убрать</button><button data-t="1" class="side">Ход белых</button><button data-t="-1" class="side">Ход чёрных</button><button id="clr" class="erase">Очистить доску</button>';
      el.innerHTML = h;
      el.onclick = function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.id === 'clr') { S.pos = { b: new Int8Array(64), turn: S.pos.turn, castle: 0, ep: -1, half: 0 }; draw(); return; }
        if (b.dataset.t) { S.pos = { b: S.pos.b, turn: +b.dataset.t, castle: 0, ep: -1, half: 0 }; mark(); setMsg('Расстановка: ходят ' + who() + '.'); return; }
        brush = +b.dataset.b; mark();
      };
      mark();
    }
    function mark() {
      document.querySelectorAll('#pal button[data-b]').forEach(function (b) { b.setAttribute('aria-pressed', String(brush !== null && +b.dataset.b === brush)); });
      document.querySelectorAll('#pal button[data-t]').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.t === S.pos.turn)); });
    }
    function setupClick(i) {
      if (brush === null) { setMsg('Выбери фигуру внизу, потом нажимай на клетки.'); return; }
      var b = S.pos.b.slice(); b[i] = brush;
      S.pos = { b: b, turn: S.pos.turn, castle: 0, ep: -1, half: 0 }; draw();
    }
    function enterSetup() {
      if (rv) return;
      mode = 'setup'; brush = null; S.sel = null; S.targets = []; S.hint = null; S.last = null;
      document.getElementById('pal').hidden = false; palette();
      document.getElementById('bSetup').textContent = 'Готово, играть';
      setMsg('Расстановка: выбери фигуру и нажимай на клетки. Внизу можно выбрать, кто ходит.'); draw();
    }
    function leaveSetup(silent) {
      var b = S.pos.b, wk = 0, bk = 0, bad = false, i;
      for (i = 0; i < 64; i++) {
        if (b[i] === 6) wk++; if (b[i] === -6) bk++;
        if (Math.abs(b[i]) === 1 && (i < 8 || i >= 56)) bad = true;
      }
      if (!silent) {
        if (wk !== 1 || bk !== 1) { setMsg('Нужно ровно по одному королю каждого цвета.', 'bad'); return false; }
        if (bad) { setMsg('Пешки не могут стоять на первой и последней линиях.', 'bad'); return false; }
        var other = { b: b, turn: -S.pos.turn, castle: 0, ep: -1, half: 0 };
        if (E.inCheck(other)) { setMsg('Так нельзя: король стороны, которая не ходит, под шахом.', 'bad'); return false; }
      }
      var c = 0;
      if (b[60] === 6 && b[63] === 4) c |= 1; if (b[60] === 6 && b[56] === 4) c |= 2;
      if (b[4] === -6 && b[7] === -4) c |= 4; if (b[4] === -6 && b[0] === -4) c |= 8;
      mode = 'move'; document.getElementById('pal').hidden = true; document.getElementById('bSetup').textContent = 'Расставить фигуры';
      if (!silent) { reset({ b: b, turn: S.pos.turn, castle: c, ep: -1, half: 0 }, S.pos.turn); if (!checkEnd()) turnMsg(); draw(); }
      return true;
    }
    document.getElementById('bSetup').onclick = function () { if (mode === 'setup') leaveSetup(false); else enterSetup(); };

    if (pending) {
      /* партия из игры с роботом: загружаем и сразу разбираем */
      var pg = pending; pending = null;
      startPos = pg.start; recs = pg.recs; S.pos = pg.start; S.flip = !!pg.flip;
      past = [];
      S.last = null;
      draw(); startReview();
    } else { turnMsg(); draw(); }
  }

  window.__boardMain = boardPage;
  function route() {
    clearTimers(); view.onclick = null;
    var parts = (location.hash || '#home').slice(1).split('/'), r = parts[0];
    if (['home', 'puzzles', 'play', 'live', 'lessons', 'lesson', 'y2', 'board', 'awards'].indexOf(r) < 0) r = 'home';
    document.body.classList.toggle('y2', r === 'y2'); document.body.classList.toggle('home', r === 'home');
    var m = document.getElementById('modal'); if (m) m.remove();
    setActive(r === 'lesson' ? 'lessons' : r);
    if (r === 'puzzles') puzzles();
    else if (r === 'play') { var w = +parts[1]; if (w >= 1 && w <= WORLDS.length && unlocked((w - 1) * SUB + 1)) playWorld(w - 1); else playWorlds(); }
    else if (r === 'live') liveList();
    else if (r === 'lessons') lessons();
    else if (r === 'lesson') lessonPage(parts[1], +parts[2] || 0);
    else if (r === 'y2') window.__y2(parts);
    else if (r === 'board') boardPage();
    else if (r === 'awards') awards();
    else home();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  var sb = document.getElementById('snd');
  if (sb) {
    var upd = function () { sb.setAttribute('aria-pressed', String(!muted)); sb.textContent = muted ? 'Звук выкл' : 'Звук вкл'; };
    sb.onclick = function () { muted = !muted; lsSet('ukc_mute', muted); upd(); if (!muted) sfx('good'); };
    upd();
  }
  window.__T = { LESS: LESS, GROUPS: GROUPS, genPiece: genPiece, solveEx: solveEx, uciMove: uciMove, buildBook: buildBook, bad: function () { return BOOKBAD; }, E: E, mkRng: mkRng, lone: lone, PN: PN, SQN: SQN, notation: notation };
  updPts();
  route();
})();

</script>
